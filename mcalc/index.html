<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mortgage Analyzer Pro</title>
    <link rel="stylesheet" href="./style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="top-bar">
        <h1>Mortgage Analyzer Pro</h1>
        <div class="button-row">
            <button class="btn-primary" id="shareButton" data-action="share">Copy Share Link</button>
            <span id="shareStatus" class="share-status" role="status" aria-live="polite"></span>
            <button class="btn-secondary" id="exportButton">Export Data</button>
            <input type="file" id="importFile" accept="application/json" hidden>
            <button class="btn-secondary" id="importButton">Import JSON</button>
        </div>
    </div>

    <nav id="homeTabsContainer" class="home-tabs" aria-label="Properties"></nav>
    <main id="appContent"></main>
    <section id="resultsContainer" aria-live="polite"></section>
    <div id="urlDataPrompt" class="url-data-prompt" role="dialog" aria-modal="true" aria-labelledby="urlDataPromptTitle" hidden>
        <div class="url-data-prompt-card">
            <h2 id="urlDataPromptTitle">Load shared calculator data?</h2>
            <p>This link contains mortgage calculator data. Choose whether to use it or keep the data already in this browser.</p>
            <div class="button-row url-data-prompt-actions">
                <button class="btn-primary" data-action="use-url-data">Use URL data</button>
                <button class="btn-secondary" data-action="cancel-url-data">Cancel</button>
            </div>
        </div>
    </div>

    <script type="module" src="./src/app.js?v=share-links-7"></script>
</body>
</html>
